<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#e8edef">
    <title>Zlo Agent 运行中台</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/dashboard.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到内容</a>
    <aside class="sidebar" aria-label="中台导航">
      <a class="brand" href="#overview">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span><strong>Zlo Agent</strong><small>运行中台</small></span>
      </a>
      <nav id="navigation" aria-label="主导航">
        <a href="#overview" data-view="overview">总览</a>
        <a href="#traces" data-view="traces">任务与追踪</a>
        <a href="#models" data-view="models">模型与资源</a>
        <a href="#tools" data-view="tools">工具与可靠性</a>
        <a href="#memory" data-view="memory">记忆与上下文</a>
        <a href="#judgment" data-view="judgment">Judgment</a>
        <a href="#evaluation" data-view="evaluation">独立评估</a>
      </nav>
      <div class="sidebar-foot"><span class="local-dot" aria-hidden="true"></span>本机访问</div>
    </aside>
    <main id="content" tabindex="-1">
      <header class="masthead">
        <h1 id="page-title">运行总览</h1>
        <div class="masthead-actions">
          <span id="connection" class="connection" role="status">等待连接</span>
          <button id="refresh" type="button" class="button">刷新</button>
        </div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <form id="filters" class="filters glass" aria-label="运行筛选" hidden>
        <label>时间<select name="period"><option value="all">全部时间</option><option value="24">最近 24 小时</option><option value="168">最近 7 天</option><option value="720">最近 30 天</option><option value="custom">自定义</option></select></label>
        <label class="custom-time" hidden>开始<input type="datetime-local" name="from"></label>
        <label class="custom-time" hidden>结束<input type="datetime-local" name="to"></label>
        <label>任务 ID<input name="taskId" list="task-ids" maxlength="128" placeholder="全部任务"><datalist id="task-ids"></datalist></label>
        <label>Agent 角色<select name="role"><option value="">全部角色</option><option value="root">Root</option><option value="team">Team</option><option value="worker">Worker</option></select></label>
        <label>Provider<input name="provider" list="providers" maxlength="128" placeholder="全部 Provider"><datalist id="providers"></datalist></label>
        <label>模型<input name="model" list="model-ids" maxlength="128" placeholder="全部模型"><datalist id="model-ids"></datalist></label>
        <label>运行状态<select name="status"><option value="">全部状态</option><option value="ready">就绪</option><option value="running">执行中</option><option value="verifying">验收中</option><option value="succeeded">执行完成</option><option value="failed">失败</option><option value="blocked">阻塞</option><option value="stop_requested">已请求停止</option><option value="stopping">正在停止</option><option value="stopped">已停止</option><option value="needs_reconciliation">待核对</option></select></label>
        <button type="submit" class="button primary">应用筛选</button>
        <button type="reset" class="button subtle">重置</button>
      </form>
      <div id="view" aria-labelledby="page-title"></div>
    </main>
  </body>
</html>
